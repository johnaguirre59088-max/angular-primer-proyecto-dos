<div class="container my-5">
  <span class="stamp mb-2">Datos del sistema</span>
  <h2 class="mt-2 mb-4">Recomendado hoy</h2>

  <div class="dossier">

    <div class="dossier__fila" *ngIf="platoEstrella() as plato">
      <div class="dossier__img hud-frame">
        <img [src]="plato.strMealThumb" [alt]="plato.strMeal">
      </div>
      <div class="dossier__info">
        <span class="dossier__tag">Plato estrella</span>
        <h5>{{ plato.strMeal }}</h5>
        <p class="mb-0">{{ plato.strCategory }} · {{ plato.strArea }}</p>
      </div>
      <div class="dossier__precio">${{ precioPlato | number:'1.0-0' }}</div>
    </div>

    <div class="dossier__fila" *ngIf="bebidaEstrella() as bebida">
      <div class="dossier__img hud-frame">
        <img [src]="bebida.strDrinkThumb" [alt]="bebida.strDrink">
      </div>
      <div class="dossier__info">
        <span class="dossier__tag">Bebida estrella</span>
        <h5>{{ bebida.strDrink }}</h5>
        <p class="mb-0">{{ bebida.strCategory }} · {{ bebida.strAlcoholic }}</p>
      </div>
      <div class="dossier__precio">${{ precioBebida | number:'1.0-0' }}</div>
    </div>

  </div>
</div>
